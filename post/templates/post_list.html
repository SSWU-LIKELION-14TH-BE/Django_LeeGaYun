<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>게시글 목록</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/post_list.css' %}">
</head>
<body>
    <div class="post-list-wrapper">
        <div class="post-list-title">게시글 목록</div>
        <form method="get" action="" class="search-form" id="searchForm">
            <input type="text" name="q" placeholder="제목으로 검색" value="{{ request.GET.q }}" id="searchInput" autocomplete="off">
            <select name="sort" id="sortSelect">
                <option value="new" {% if request.GET.sort == "new" or not request.GET.sort %}selected{% endif %}>최신순</option>
                <option value="popular" {% if request.GET.sort == "popular" %}selected{% endif %}>인기순</option>
            </select>
        </form>
        <script>
        const searchInput = document.getElementById('searchInput');
        const searchForm = document.getElementById('searchForm');
        const sortSelect = document.getElementById('sortSelect');
        let timer = null;
        searchInput.addEventListener('input', function() {
            clearTimeout(timer);
            timer = setTimeout(() => {
                searchForm.submit();
            }, 350);
        });
        sortSelect.addEventListener('change', function() {
            searchForm.submit();
        });
        </script>
        <ul class="post-list">
            {% for post in posts %}
                <li>
                    <a href="{% url 'post_detail' post.pk %}">{{ post.title }}</a>
                    <span> {{ post.author }}</span>
                    <span>{{ post.created_at|date:'Y-m-d H:i' }}</span>
                </li>
            {% empty %}
                <li>게시글이 없습니다.</li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
